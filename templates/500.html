{% extends "base.html" %}

{% block title %}Something went wrong · SkillMatch{% endblock %}

{% block content %}

    <h1 id="server-error-title">We hit a snag.</h1>

    <a class="button button--primary" href="{{ url_for('home') }}">Back to SkillMatch</a>
  </section>
{% endblock %}
